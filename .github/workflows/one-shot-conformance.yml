name: Bootstrap deterministic conformance fixtures

on:
  push:
    branches:
      - feat/deterministic-uir-conformance-final
    paths:
      - .github/workflows/one-shot-conformance.yml

permissions:
  contents: write

jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deterministic-uir-conformance-final
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Freeze independently reviewed source contracts
        run: node tool/uir_conformance.mjs --snapshot-sources

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Conformance and rendered tests
        run: npm test

      - name: Pages export tests
        run: npm run test:pages

      - name: Commit frozen source contracts
        run: |
          rm -f .github/workflows/one-shot-conformance.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- uir/source/design.json uir/source/design-system.json .github/workflows/one-shot-conformance.yml
          git diff --cached --check
          git commit -m "freeze design and design-system conformance sources"
          git push origin HEAD:feat/deterministic-uir-conformance-final
