name: UIR site CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: uir-site-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Reproduce, audit, and render
    runs-on: ${{ github.event.repository.private && 'self-hosted' || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify the public UIR showcase
        uses: ./.github/actions/check-site
        with:
          author: uir/author_site.py
          package: app/uir-package
          baseline: uir/ci-baseline.json
          evidence: uir/evidence.json
          audit: uir/official-audit.json
          review-output: .uir-ci/review.md

      - name: Preserve the UIR review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uir-site-review
          path: |
            .uir-ci/review.md
            uir/official-audit.json
            uir/evidence.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install site dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rendered output tests
        run: npm test

      - name: GitHub Pages export tests
        run: npm run test:pages

      - name: Upload the GitHub Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    name: Publish GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish the verified static site
        id: deployment
        uses: actions/deploy-pages@v4

  # ── Claude review ───────────────────────────────────────────────────────────
  # The review lives ONCE, in tenbytesltd/playbooks@v1, with the model, the
  # pinned action SHA, the fork guard and the dedup rules shared by every
  # consumer. What is ours is `.github/claude-review-focus.md`, which is
  # ordinary repo content on purpose: the action refuses to run whenever a pull
  # request's review WORKFLOW differs from the default branch's copy, so a focus
  # kept in here would blind the very pull request that tunes it.
  #
  # A JOB here rather than its own workflow, for the reason exams-design-system
  # found the hard way: a separate workflow RACES this one, and a review that
  # posts after the gate has finished is a review nobody waited for.
  #
  # Requires the repository secret CLAUDE_CODE_OAUTH_TOKEN.
  review:
    name: Claude review
    # Pull requests only, and never a fork's code. The shared workflow gates
    # forks too; this is the near half of the same door, and it matters more
    # here than in the private repositories because this one accepts them.
    if: >-
      ${{ github.event_name == 'pull_request' && !github.event.pull_request.draft
          && github.event.pull_request.head.repo.full_name == github.repository }}
    uses: tenbytesltd/playbooks/.github/workflows/claude-review.yml@v1
    # REQUIRED here rather than there: a called workflow can only NARROW
    # GITHUB_TOKEN, never widen it, so these are what let the review post.
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    secrets: inherit
    with:
      runner_labels: '["ubuntu-latest"]'
