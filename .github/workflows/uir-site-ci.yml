name: UIR site CI

on:
  pull_request:
  push:
  workflow_dispatch:
    branches: [main]

concurrency:
  group: uir-site-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Reproduce, audit, and render
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Verify the public UIR showcase
        uses: ./.github/actions/check-site
        with:
          author: uir/author_site.py
          package: app/uir-package
          baseline: uir/ci-baseline.json
          evidence: uir/evidence.json
          audit: uir/official-audit.json
          review-output: .uir-ci/review.md

      - name: Preserve the UIR review evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: uir-site-review
          path: |
            .uir-ci/review.md
            uir/official-audit.json
            uir/evidence.json
          if-no-files-found: warn
          retention-days: 14

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install site dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Rendered output tests
        run: npm test
