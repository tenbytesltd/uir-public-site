name: Wire Piece identities into conformance target

on:
  push:
    branches:
      - feat/deterministic-uir-conformance-final
    paths:
      - .github/workflows/one-shot-piece-contract.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deterministic-uir-conformance-final
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Add Piece and binding identity hooks
        run: |
          python3 - <<'PY'
          from pathlib import Path

          app = Path('app/uir.tsx')
          text = app.read_text(encoding='utf-8')
          old = '''  const body = node.gap ?? node.content;
          const common = {
            id: node.key,
            "data-node": node.key,
            "data-role": node.role,
            "data-salience": node.salience,
            ...nodePresentationData(node),
            style: nodeStyle(node),
          };'''
          new = '''  const body = node.gap ?? node.content;
          const piece = resolutionPiece(node.role);
          const conformanceBindings = [...resolvedBindings(node).entries()]
            .sort(([a], [b]) => a.localeCompare(b))
            .map(([slot, groundRole]) => `${slot}=${groundRole}`)
            .join("|");
          const common = {
            id: node.key,
            "data-node": node.key,
            "data-role": node.role,
            "data-salience": node.salience,
            "data-uir-piece": piece,
            "data-uir-bindings": conformanceBindings,
            ...nodePresentationData(node),
            style: nodeStyle(node),
          };'''
          if old not in text:
              raise SystemExit('RenderNode common block not found')
          app.write_text(text.replace(old, new, 1), encoding='utf-8')

          verifier = Path('tool/uir_conformance.mjs')
          text = verifier.read_text(encoding='utf-8')
          old = '''    if (actual.attrs["data-role"] !== role) mismatches.push(`${key}: role expected ${role}, got ${actual.attrs["data-role"]}`);
              if (actual.attrs["data-salience"] !== salience) mismatches.push(`${key}: salience expected ${salience}, got ${actual.attrs["data-salience"]}`);
              if (actual.parent !== expectedParent) mismatches.push(`${key}: parent expected ${expectedParent}, got ${actual.parent}`);'''
          new = '''    if (actual.attrs["data-role"] !== role) mismatches.push(`${key}: role expected ${role}, got ${actual.attrs["data-role"]}`);
              if (actual.attrs["data-salience"] !== salience) mismatches.push(`${key}: salience expected ${salience}, got ${actual.attrs["data-salience"]}`);
              const expectedPiece = pkg.resolutionPiece(subject);
              if (actual.attrs["data-uir-piece"] !== expectedPiece) {
                mismatches.push(`${key}: Piece expected ${expectedPiece}, got ${actual.attrs["data-uir-piece"]}`);
              }
              const expectedBindings = [...pkg.resolvedBindings(subject).entries()]
                .sort(([a], [b]) => a.localeCompare(b))
                .map(([slot, groundRole]) => `${slot}=${groundRole}`)
                .join("|");
              if (actual.attrs["data-uir-bindings"] !== expectedBindings) {
                mismatches.push(`${key}: bindings expected ${expectedBindings}, got ${actual.attrs["data-uir-bindings"]}`);
              }
              if (actual.parent !== expectedParent) mismatches.push(`${key}: parent expected ${expectedParent}, got ${actual.parent}`);'''
          if old not in text:
              raise SystemExit('Verifier role/salience block not found')
          verifier.write_text(text.replace(old, new, 1), encoding='utf-8')

          tests = Path('tests/uir-conformance.test.mjs')
          text = tests.read_text(encoding='utf-8')
          marker = '''test("the conformance gate catches design-system realization drift", async () => {'''
          addition = '''test("the conformance gate catches wrong Piece selection even when appearance could match", async () => {
            const response = await render();
            const html = await response.text();
            const mutated = html.replace(/data-uir-piece="[^"]+"/, 'data-uir-piece="uir-site:piece:wrong"');
            assert.notEqual(mutated, html, "Piece mutation fixture did not match rendered HTML");
            const result = await verifyRenderedTarget(mutated);
            assert.equal(result.ok, false);
            assert.match(explain(result), /Piece expected .* got uir-site:piece:wrong/);
          });

          '''
          if marker not in text:
              raise SystemExit('DS drift test marker not found')
          tests.write_text(text.replace(marker, addition + marker, 1), encoding='utf-8')
          PY

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Test
        run: npm test
      - name: Pages
        run: npm run test:pages

      - name: Commit
        run: |
          rm -f .github/workflows/one-shot-piece-contract.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/uir.tsx tool/uir_conformance.mjs tests/uir-conformance.test.mjs .github/workflows/one-shot-piece-contract.yml
          git diff --cached --check
          git commit -m "verify Piece and binding identity in target conformance"
          git push origin HEAD:feat/deterministic-uir-conformance-final
