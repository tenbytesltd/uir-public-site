name: One-shot lower-page narrative rewrite

on:
  push:
    branches:
      - copy/ship-the-ui-you-designed
    paths:
      - .github/workflows/one-shot-lower-copy.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: copy/ship-the-ui-you-designed
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Rewrite lower-page narrative
        run: python3 tool/one_shot_rewrite_lower.py

      - name: Rebuild checked package
        run: python3 tool/build_public_package.py

      - name: Verify site output
        run: |
          npm ci
          npm run lint
          npm test
          npm run test:pages

      - name: Commit narrative rewrite
        run: |
          rm -f .github/workflows/one-shot-lower-copy.yml tool/one_shot_rewrite_lower.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add uir/author_site.py app/uir-package tests/rendered-html.test.mjs .github/workflows/one-shot-lower-copy.yml tool/one_shot_rewrite_lower.py
          git diff --cached --check
          git commit -m "rewrite lower landing narrative around verification"
          git push origin HEAD:copy/ship-the-ui-you-designed
