name: Rewrite public target as real React site

on:
  push:
    branches:
      - feat/deterministic-uir-conformance-final
    paths:
      - .github/workflows/one-shot-real-react-target.yml

permissions:
  contents: write

jobs:
  rewrite:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/deterministic-uir-conformance-final
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Rewrite target
        run: |
          python3 tool/rewrite_public_target_to_react.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('app/uir-data.ts')
          text = path.read_text(encoding='utf-8')
          start = text.index('const firstPrimaryHeading =')
          end = text.index('\n\nconst sourceNames', start)
          path.write_text(text[:start] + text[end + 2:], encoding='utf-8')
          PY

      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Conformance and rendered tests
        run: npm test
      - name: Pages export tests
        run: npm run test:pages

      - name: Commit
        run: |
          rm -f tool/rewrite_public_target_to_react.py .github/workflows/one-shot-real-react-target.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- app/Site.tsx app/design-system.tsx app/uir-data.ts app/page.tsx app/uir.tsx tests/rendered-html.test.mjs tests/uir-conformance.test.mjs docs/CONFORMANCE.md tool/rewrite_public_target_to_react.py .github/workflows/one-shot-real-react-target.yml
          git diff --cached --check
          git commit -m "replace generic renderer with real React target"
          git push origin HEAD:feat/deterministic-uir-conformance-final
