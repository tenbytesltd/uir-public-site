name: One-shot UIR copy rewrite

on:
  push:
    branches:
      - copy/clarify-uir-positioning

permissions:
  contents: write

jobs:
  rewrite:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply UIR-first copy rewrite
        run: python3 tool/apply_copy_rewrite.py
      - name: Regenerate checked UIR package
        run: python3 tool/build_public_package.py
      - name: Install dependencies
        run: npm ci
      - name: Verify rendered contract
        run: |
          npm run lint
          npm test
      - name: Remove one-shot helpers
        run: git rm tool/apply_copy_rewrite.py .github/workflows/one-shot-copy-rewrite.yml
      - name: Commit regenerated UIR source and package
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add uir/author_site.py app/uir-package tests/rendered-html.test.mjs
          git commit -m 'refine UIR public copy around the representation'
          git push origin HEAD:copy/clarify-uir-positioning
